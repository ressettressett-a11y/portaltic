    <script>
        (function () {
            'use strict';

            /* ── Variables de Estado y Elementos ──────────────────────── */
            var portalData = null;
            var headerSearchForm = document.getElementById('header-search-form');
            var headerSearchInput = document.getElementById('header-search-input');
            var suggestionsPanel = document.getElementById('search-suggestions');
            var activeSuggestIdx = -1;
            var suggestDebounce = null;
            var lastQuery = '';

            /* ── Iconos SVG para Sugerencias ────────────────────────── */
            var svgSearch = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
            var svgArrow = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="7 17 17 7"/><polyline points="7 7 17 7 17 17"/></svg>';
            var svgFaq = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
            var svgCard = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>';
            var svgBookmark = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
            var svgHistory = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';

            /* ── Historial de Búsquedas Recientes y Visitas (Autocompletado) ── */
            var HISTORY_KEY = 'portal_search_history_v2';
            var MAX_HISTORY = 50;

            function getSearchHistory() {
                try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
                catch (e) { return []; }
            }

            function recordVisit(type, title, urlOrQuery, icon, badgeClass, badgeText) {
                if (!urlOrQuery) return;
                var history = getSearchHistory();
                
                history = history.filter(function (h) {
                    if (type === 'url') {
                        return h.type !== 'url' || h.url.toLowerCase() !== urlOrQuery.toLowerCase();
                    } else {
                        return h.type !== 'query' || h.query.toLowerCase() !== urlOrQuery.toLowerCase();
                    }
                });

                var newEntry = {
                    type: type,
                    time: Date.now()
                };

                if (type === 'url') {
                    newEntry.title = title || urlOrQuery;
                    newEntry.url = urlOrQuery;
                    newEntry.icon = icon || '🌐';
                    newEntry.badgeClass = badgeClass || 'suggest-badge-web';
                    newEntry.badgeText = badgeText || 'URL';
                } else {
                    newEntry.query = urlOrQuery;
                }

                history.unshift(newEntry);
                if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
                localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            }

            function getHistoryMatches(q) {
                if (!q) return [];
                var history = getSearchHistory();
                var matches = [];
                var seenUrls = {};
                var seenQueries = {};

                var search = q.toLowerCase();
                history.forEach(function (h) {
                    if (h.type === 'url') {
                        var title = h.title || '';
                        var url = h.url || '';
                        if (title.toLowerCase().indexOf(search) !== -1 || url.toLowerCase().indexOf(search) !== -1) {
                            var cleanUrl = url.toLowerCase();
                            if (!seenUrls[cleanUrl]) {
                                seenUrls[cleanUrl] = true;
                                matches.push({
                                    type: 'url',
                                    title: h.title,
                                    url: h.url,
                                    icon: h.icon,
                                    badgeClass: h.badgeClass,
                                    badgeText: h.badgeText
                                });
                            }
                        }
                    } else {
                        var query = h.query || '';
                        if (query.toLowerCase().indexOf(search) !== -1) {
                            var cleanQ = query.toLowerCase();
                            if (!seenQueries[cleanQ]) {
                                seenQueries[cleanQ] = true;
                                matches.push({
                                    type: 'query',
                                    query: query
                                });
                            }
                        }
                    }
                });
                return matches.slice(0, 6);
            }

            /* ── Función de Escape HTML para Seguridad (XSS Prevention) ── */
            function esc(str) {
                if (str === null || str === undefined) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            /* ═════════════════════════════════════════════════════════════
               RELOJ
            ═════════════════════════════════════════════════════════════ */
            function tickClock() {
                var el = document.getElementById('navbar-clock');
                if (!el) return;
                var d = new Date();
                var h = pad(d.getHours()), m = pad(d.getMinutes()), s = pad(d.getSeconds());
                el.textContent = h + ':' + m + ':' + s;
            }
            function pad(n) { return n < 10 ? '0' + n : n; }
            tickClock();
            setInterval(tickClock, 1000);

            /* ═════════════════════════════════════════════════════════════
               TOAST
            ═════════════════════════════════════════════════════════════ */
            var toastTimer = null;
            function showToast(msg, type, duration) {
                duration = duration || 3000;
                var t = document.getElementById('toast');
                if (!t) return;
                t.textContent = msg;
                t.className = 'show' + (type ? ' ' + type : '');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(function () { t.className = ''; }, duration);
            }

            /* ═════════════════════════════════════════════════════════════
               LOAD DATA
            ═════════════════════════════════════════════════════════════ */
            function loadData(silent) {
                if (!silent && !portalData) {
                    var tc = document.getElementById('top-cards');
                    if (tc) tc.innerHTML = '<div class="skeleton skeleton-card"></div>'.repeat(4);
                }
                fetch('api.php')
                    .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
                    .then(function (data) {
                        if (data.error) throw new Error(data.error);
                        portalData = data;
                        renderPortal(data);
                    })
                    .catch(function (err) {
                        console.error('Error al cargar datos:', err);
                        var tc = document.getElementById('top-cards');
                        if (!silent && tc) {
                            tc.innerHTML = '<div style="grid-column:1/-1;padding:20px;color:var(--danger);font-size:.87rem;">⚠️ Error al cargar datos del portal.</div>';
                        }
                        showToast('Error al cargar datos del portal', 'error');
                    });
            }

            function renderPortal(data) {
                var s = data.settings || {};
                if (s.site_title) { document.title = s.site_title; }
                var siteTitleEl = document.getElementById('site-title');
                if (siteTitleEl && s.site_title) { siteTitleEl.textContent = s.site_title; }
                var footerTextEl = document.getElementById('footer-text');
                if (footerTextEl && s.footer_text) { footerTextEl.textContent = s.footer_text; }
                renderCards(data.cards || []);
                renderFaqs(data.faqs || []);
                renderVideos(data.videos || []);
                renderBookmarks();
            }

            var CARD_COLORS = ['#1a6fa8', '#10b981', '#f59e0b', '#8b5cf6', '#ef4444', '#0ea5e9'];
            function renderCards(cards) {
                var container = document.getElementById('top-cards');
                if (!container) return;
                container.innerHTML = '';
                cards.forEach(function (card, i) {
                    var color = CARD_COLORS[i % CARD_COLORS.length];
                    var el = document.createElement('a');
                    el.href = card.button_url || '#';
                    el.target = '_blank';
                    el.className = 'top-card fade-in';
                    el.style.animationDelay = (i * 0.06) + 's';
                    el.innerHTML = '<div class="top-card-icon" style="color:' + color + ';background:' + color + '15;">' + 
                        (card.image_path ? '<img src="' + esc(card.image_path) + '" onerror="this.style.display=\'none\'">' : '🔗') + '</div>' +
                        '<span class="top-card-label">' + esc(card.title || '') + '</span>';
                    el.addEventListener('click', function () {
                        recordVisit('url', card.title, card.button_url, '📱', 'suggest-badge-card', 'Acceso');
                    });
                    container.appendChild(el);
                });
            }

            /* ═════════════════════════════════════════════════════════════
               MARCADORES (SYSTEM Y LOCAL)
            ═════════════════════════════════════════════════════════════ */
            function getLocalBookmarks() {
                try { return JSON.parse(localStorage.getItem('portal_bookmarks_v2') || '[]'); }
                catch (e) { return []; }
            }
            function setLocalBookmarks(arr) { localStorage.setItem('portal_bookmarks_v2', JSON.stringify(arr)); }

            function renderBookmarks() {
                var grid = document.getElementById('bookmarks-grid');
                if (!grid) return;
                grid.innerHTML = '';

                var localBookmarks = getLocalBookmarks();
                
                var section = grid.closest('.bookmarks-section');
                if (localBookmarks.length === 0) {
                    if (section) section.style.display = 'none';
                    return;
                }
                if (section) section.style.display = '';

                function createCard(bm, index) {
                    var card = document.createElement('a');
                    card.href = bm.url;
                    card.target = '_blank';
                    card.className = 'bookmark-card fade-in';
                    
                    var cleanUrl = bm.url.replace(/^https?:\/\//i, '');

                    card.innerHTML = '<div class="bookmark-icon">' + esc(bm.icon || '⭐') + '</div>' +
                        '<div class="bookmark-content">' +
                        '<span class="bookmark-name">' + esc(bm.title) + '</span>' +
                        '<span class="bookmark-url">' + esc(cleanUrl) + '</span>' +
                        '</div>';

                    card.addEventListener('click', function () {
                        recordVisit('url', bm.title, bm.url, bm.icon || '⭐', 'suggest-badge-bookmark', 'Fav');
                    });

                    var delBtn = document.createElement('button');
                    delBtn.className = 'bm-delete-btn';
                    delBtn.innerHTML = '&#10005;';
                    delBtn.title = 'Eliminar favorito';
                    delBtn.onclick = function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        deleteBookmark(index);
                    };
                    card.appendChild(delBtn);
                    grid.appendChild(card);
                }

                localBookmarks.forEach(function (bm, i) {
                    createCard(bm, i);
                });
            }

            window.openBookmarkModal = function () {
                var modal = document.getElementById('bookmarkModal');
                if (modal) modal.classList.add('open');
            };

            window.closeBookmarkModal = function () {
                var modal = document.getElementById('bookmarkModal');
                if (modal) modal.classList.remove('open');
                ['bm_title', 'bm_url', 'bm_icon'].forEach(function (id) {
                    var el = document.getElementById(id);
                    if (el) el.value = '';
                });
                ['bm_title_err', 'bm_url_err'].forEach(function (id) {
                    var el = document.getElementById(id);
                    if (el) el.textContent = '';
                });
            };

            window.deleteBookmark = function (index) {
                var bookmarks = getLocalBookmarks();
                if (index < 0 || index >= bookmarks.length) return;
                var name = bookmarks[index].title;
                bookmarks.splice(index, 1);
                setLocalBookmarks(bookmarks);
                renderBookmarks();
                showToast('Marcador eliminado: ' + name, 'error');
            };

            window.saveBookmark = function () {
                var titleEl = document.getElementById('bm_title');
                var urlEl = document.getElementById('bm_url');
                var iconEl = document.getElementById('bm_icon');
                if (!titleEl || !urlEl) return;

                var title = titleEl.value.trim();
                var url = urlEl.value.trim();
                var icon = iconEl ? iconEl.value.trim() : '';

                var titleErr = document.getElementById('bm_title_err');
                var urlErr = document.getElementById('bm_url_err');
                if (titleErr) titleErr.textContent = '';
                if (urlErr) urlErr.textContent = '';

                var hasErr = false;
                if (!title) {
                    if (titleErr) titleErr.textContent = 'El título es obligatorio';
                    hasErr = true;
                }
                if (!url) {
                    if (urlErr) urlErr.textContent = 'La URL es obligatoria';
                    hasErr = true;
                } else if (!isValidUrlFormat(url)) {
                    if (urlErr) urlErr.textContent = 'Ingrese un formato de URL válido (ej: google.com o https://...)';
                    hasErr = true;
                }

                if (hasErr) return;

                var bookmarks = getLocalBookmarks();
                bookmarks.push({ title: title, url: url, icon: icon });
                setLocalBookmarks(bookmarks);
                closeBookmarkModal();
                renderBookmarks();
                showToast('Marcador guardado', 'success');
            };

            /* ═════════════════════════════════════════════════════════════
               FAQS
            ═════════════════════════════════════════════════════════════ */
            function renderFaqs(faqs) {
                var container = document.getElementById('faq-container');
                if (!container) return;
                container.innerHTML = '';
                var faqCount = document.getElementById('faq-count');
                if (faqCount) faqCount.textContent = faqs.length + ' preguntas';

                if (faqs.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><p>No hay preguntas disponibles.</p></div>';
                    return;
                }

                faqs.forEach(function (faq) {
                    var item = document.createElement('div');
                    item.className = 'faq-item';
                    item.innerHTML = '<div class="faq-q" tabindex="0"><span>' + esc(faq.question) + '</span><span class="faq-chevron">▼</span></div><div class="faq-a">' + (faq.answer || '').replace(/\n/g, '<br>') + '</div>';
                    
                    var qEl = item.querySelector('.faq-q');
                    if (qEl) {
                        qEl.addEventListener('click', function () {
                            var isActive = item.classList.contains('active');
                            document.querySelectorAll('.faq-item').forEach(function (fi) { fi.classList.remove('active'); });
                            if (!isActive) item.classList.add('active');
                        });
                    }
                    container.appendChild(item);
                });
            }

            /* ═════════════════════════════════════════════════════════════
               VIDEOS
            ═════════════════════════════════════════════════════════════ */
            function renderVideos(videos) {
                var player = document.getElementById('help-video');
                var source = document.getElementById('help-video-source');
                var btns = document.getElementById('video-buttons');
                var emptyMsg = document.getElementById('video-empty');
                var videoCount = document.getElementById('video-count');

                if (videoCount) videoCount.textContent = videos.length + ' videos';
                if (!btns) return;
                btns.innerHTML = '';

                if (videos.length === 0) {
                    if (player) player.style.display = 'none';
                    if (emptyMsg) emptyMsg.style.display = 'block';
                    return;
                }

                if (player) player.style.display = 'block';
                if (emptyMsg) emptyMsg.style.display = 'none';

                if (source && player) {
                    source.src = 'video_proxy.php?path=' + encodeURIComponent(videos[0].source);
                    player.load();
                }

                videos.forEach(function (v, index) {
                    var btn = document.createElement('button');
                    btn.textContent = v.title || ('Video ' + (index + 1));
                    if (index === 0) btn.className = 'active';

                    btn.addEventListener('click', function () {
                        document.querySelectorAll('.video-nav button').forEach(function (b) {
                            b.classList.remove('active');
                        });
                        btn.classList.add('active');
                        if (source && player) {
                            source.src = 'video_proxy.php?path=' + encodeURIComponent(v.source);
                            player.load();
                            player.play().catch(function (e) { console.log('Autoplay blocked or failed:', e); });
                        }
                    });
                    btns.appendChild(btn);
                });
            }

            /* ═════════════════════════════════════════════════════════════
               BUSQUEDA Y SUGERENCIAS DILIGENTES
            ═════════════════════════════════════════════════════════════ */
            function performSearch(val) {
                if (!val) return;
                
                if (isValidUrlFormat(val)) {
                    var targetUrl = val;
                    if (!/^https?:\/\//i.test(targetUrl)) targetUrl = 'https://' + targetUrl;
                    recordVisit('url', 'Ir directamente a ' + val, targetUrl, '🌐', 'suggest-badge-web', 'URL');
                    window.open(targetUrl, '_blank');
                } else {
                    recordVisit('query', null, val);
                    var targetUrl = 'https://www.google.com/search?q=' + encodeURIComponent(val);
                    window.open(targetUrl, '_blank');
                }

                if (headerSearchInput) {
                    headerSearchInput.value = '';
                }
                closeSuggestions();
            }

            function closeSuggestions() {
                if (suggestionsPanel) {
                    suggestionsPanel.classList.remove('active');
                    suggestionsPanel.innerHTML = '';
                }
                activeSuggestIdx = -1;
            }

            function buildSuggestions(query) {
                var q = query.trim();
                lastQuery = q;
                if (!q) {
                    closeSuggestions();
                    return;
                }

                var historyMatches = getHistoryMatches(q);
                var localMatches = getLocalMatches(q);
                renderSuggestionsUI(q, historyMatches, localMatches, []);

                if (q.length >= 2) {
                    fetchGoogleSuggestions(q, function (googleSuggestions) {
                        if (lastQuery === q) {
                            renderSuggestionsUI(q, historyMatches, localMatches, googleSuggestions);
                        }
                    });
                }
            }

            function getLocalMatches(q) {
                var search = q.toLowerCase();
                var matches = [];
                var seenUrls = {};

                var localBookmarks = getLocalBookmarks();
                localBookmarks.forEach(function (bm) {
                    if ((bm.title || '').toLowerCase().indexOf(search) !== -1 || (bm.url || '').toLowerCase().indexOf(search) !== -1) {
                        if (!seenUrls[bm.url]) {
                            seenUrls[bm.url] = true;
                            matches.push({
                                type: 'bookmark-local',
                                title: bm.title,
                                url: bm.url,
                                icon: bm.icon || '⭐',
                                badgeClass: 'suggest-badge-bookmark',
                                badgeText: 'Fav'
                            });
                        }
                    }
                });

                var cards = (portalData && portalData.cards) || [];
                cards.forEach(function (c) {
                    if ((c.title || '').toLowerCase().indexOf(search) !== -1 || (c.button_url || '').toLowerCase().indexOf(search) !== -1) {
                        if (!seenUrls[c.button_url]) {
                            seenUrls[c.button_url] = true;
                            matches.push({
                                type: 'card',
                                title: c.title,
                                url: c.button_url,
                                icon: '📱',
                                badgeClass: 'suggest-badge-card',
                                badgeText: 'Acceso'
                            });
                        }
                    }
                });

                var faqs = (portalData && portalData.faqs) || [];
                faqs.forEach(function (f) {
                    if ((f.question || '').toLowerCase().indexOf(search) !== -1 || (f.answer || '').toLowerCase().indexOf(search) !== -1) {
                        matches.push({
                            type: 'faq',
                            title: f.question,
                            icon: '❓',
                            badgeClass: 'suggest-badge-faq',
                            badgeText: 'FAQ'
                        });
                    }
                });

                if (isValidUrlFormat(q)) {
                    var formattedUrl = q;
                    if (!/^https?:\/\//i.test(formattedUrl)) formattedUrl = 'https://' + formattedUrl;
                    if (!seenUrls[formattedUrl]) {
                        matches.push({
                            type: 'url',
                            title: 'Ir directamente a ' + q,
                            url: formattedUrl,
                            icon: '🌐',
                            badgeClass: 'suggest-badge-web',
                            badgeText: 'URL'
                        });
                    }
                }

                return matches;
            }

            function fetchGoogleSuggestions(q, callback) {
                var url = 'search_suggestions.php?q=' + encodeURIComponent(q);
                fetch(url)
                    .then(function (res) {
                        if (!res.ok) return ["", []];
                        return res.json();
                    })
                    .then(function (data) {
                        if (Array.isArray(data) && data.length >= 2 && Array.isArray(data[1])) {
                            callback(data[1]);
                        } else {
                            callback([]);
                        }
                    })
                    .catch(function (err) {
                        console.error('Error fetching Google suggestions:', err);
                        callback([]);
                    });
            }

            function renderSuggestionsUI(q, historyMatches, localMatches, googleSuggestions) {
                if (!suggestionsPanel) return;
                var html = '';
                var hasPrev = false;

                /* ── Historial de Navegación y Búsquedas ── */
                if (historyMatches.length > 0) {
                    html += '<div class="suggest-section-label">Búsquedas recientes y enlaces</div>';
                    historyMatches.forEach(function (hm) {
                        if (hm.type === 'url') {
                            var cleanUrl = hm.url.replace(/^https?:\/\//i, '');
                            if (cleanUrl.length > 45) cleanUrl = cleanUrl.substring(0, 45) + '…';

                            html += '<button class="suggest-item" data-action="url" data-query="' + esc(hm.url) + '" data-title="' + esc(hm.title) + '" data-icon="' + esc(hm.icon) + '" data-badge-class="' + esc(hm.badgeClass) + '" data-badge-text="' + esc(hm.badgeText) + '">';
                            html += '<span class="suggest-item-icon">' + svgHistory + '</span>';
                            html += '<span class="suggest-item-text">' + highlightSuggest(hm.title, q);
                            html += '<span class="suggest-item-url-sub"> — ' + esc(cleanUrl) + '</span>';
                            html += '</span>';
                            html += '<span class="suggest-item-badge ' + esc(hm.badgeClass || 'suggest-badge-web') + '">' + esc(hm.badgeText || 'URL') + '</span>';
                            html += '</button>';
                        } else {
                            html += '<button class="suggest-item" data-action="google" data-query="' + esc(hm.query) + '">';
                            html += '<span class="suggest-item-icon">' + svgHistory + '</span>';
                            html += '<span class="suggest-item-text">' + highlightSuggest(hm.query, q) + '</span>';
                            html += '<span class="suggest-item-badge suggest-badge-history">Búsqueda</span>';
                            html += '</button>';
                        }
                    });
                    hasPrev = true;
                }

                /* ── Coincidencias locales (Marcadores, Tarjetas, FAQs, URLs) ── */
                if (localMatches.length > 0) {
                    if (hasPrev) html += '<div class="suggest-sep"></div>';
                    html += '<div class="suggest-section-label">Marcadores y Sitios</div>';
                    localMatches.slice(0, 6).forEach(function (m) {
                        var iconHtml = svgSearch;
                        if (m.type === 'faq') iconHtml = svgFaq;
                        else if (m.type === 'card') iconHtml = svgCard;
                        else if (m.type === 'bookmark-sys' || m.type === 'bookmark-local') iconHtml = svgBookmark;
                        else if (m.type === 'url') iconHtml = svgArrow;

                        var dataAttr = '';
                        if (m.type === 'faq') {
                            dataAttr = 'data-action="faq" data-title="' + esc(m.title) + '"';
                        } else if (m.type === 'url') {
                            dataAttr = 'data-action="url" data-query="' + esc(m.url) + '" data-title="' + esc(m.title) + '" data-icon="' + esc(m.icon) + '" data-badge-class="' + esc(m.badgeClass) + '" data-badge-text="' + esc(m.badgeText) + '"';
                        } else if (m.url) {
                            dataAttr = 'data-action="card-url" data-url="' + esc(m.url) + '" data-title="' + esc(m.title) + '" data-icon="' + esc(m.icon) + '" data-badge-class="' + esc(m.badgeClass) + '" data-badge-text="' + esc(m.badgeText) + '"';
                        }

                        html += '<button class="suggest-item" ' + dataAttr + '>';
                        html += '<span class="suggest-item-icon">' + iconHtml + '</span>';
                        html += '<span class="suggest-item-text">' + highlightSuggest(m.title, q);
                        if (m.url) {
                            var shortUrl = m.url.replace(/^https?:\/\//i, '');
                            if (shortUrl.length > 45) shortUrl = shortUrl.substring(0, 45) + '…';
                            html += '<span class="suggest-item-url-sub"> — ' + esc(shortUrl) + '</span>';
                        }
                        html += '</span>';
                        html += '<span class="suggest-item-badge ' + m.badgeClass + '">' + m.badgeText + '</span>';
                        html += '</button>';
                    });
                    hasPrev = true;
                }

                /* ── Sugerencias de Google ── */
                if (googleSuggestions.length > 0) {
                    if (hasPrev) html += '<div class="suggest-sep"></div>';
                    html += '<div class="suggest-section-label">Sugerencias de Google</div>';
                    googleSuggestions.slice(0, 6).forEach(function (s) {
                        html += '<button class="suggest-item" data-action="google" data-query="' + esc(s) + '">';
                        html += '<span class="suggest-item-icon">' + svgSearch + '</span>';
                        html += '<span class="suggest-item-text">' + highlightSuggest(s, q) + '</span>';
                        html += '<span class="suggest-item-badge suggest-badge-google">Google</span>';
                        html += '</button>';
                    });
                }

                /* ── Opción por defecto: buscar en Google ── */
                if (q) {
                    html += '<div class="suggest-sep"></div>';
                    html += '<button class="suggest-item" data-action="google" data-query="' + esc(q) + '">';
                    html += '<span class="suggest-item-icon">' + svgSearch + '</span>';
                    html += '<span class="suggest-item-text">Buscar <strong>\"' + esc(q) + '\"</strong> en Google</span>';
                    html += '<span class="suggest-item-badge suggest-badge-google">Enter ↵</span>';
                    html += '</button>';
                }

                suggestionsPanel.innerHTML = html;
                suggestionsPanel.classList.add('active');
                activeSuggestIdx = -1;
                suggestionsPanel.querySelectorAll('.suggest-item').forEach(function (el) {
                    el.addEventListener('mousedown', function (e) { e.preventDefault(); handleSuggestionClick(el); });
                });
            }

            function highlightSuggest(text, q) {
                var escaped = esc(text); if (!q) return escaped;
                var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
                return escaped.replace(re, '<mark>$1</mark>');
            }

            function handleSuggestionClick(el) {
                var action = el.getAttribute('data-action');
                if (action === 'google') {
                    performSearch(el.getAttribute('data-query'));
                } else if (action === 'url') {
                    var url = el.getAttribute('data-query');
                    var title = el.getAttribute('data-title') || url;
                    var icon = el.getAttribute('data-icon') || '🌐';
                    var badgeClass = el.getAttribute('data-badge-class') || 'suggest-badge-web';
                    var badgeText = el.getAttribute('data-badge-text') || 'URL';
                    recordVisit('url', title, url, icon, badgeClass, badgeText);
                    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
                    window.open(url, '_blank');
                    headerSearchInput.value = ''; closeSuggestions();
                } else if (action === 'card-url') {
                    var url = el.getAttribute('data-url');
                    var title = el.getAttribute('data-title') || url;
                    var icon = el.getAttribute('data-icon') || '🔗';
                    var badgeClass = el.getAttribute('data-badge-class') || 'suggest-badge-bookmark';
                    var badgeText = el.getAttribute('data-badge-text') || 'Inst';
                    recordVisit('url', title, url, icon, badgeClass, badgeText);
                    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
                    window.open(url, '_blank');
                    headerSearchInput.value = ''; closeSuggestions();
                } else if (action === 'faq') {
                    var faqTitle = el.getAttribute('data-title');
                    closeSuggestions(); headerSearchInput.value = '';
                    document.querySelectorAll('.faq-item').forEach(function (fi) {
                        var qText = fi.querySelector('.faq-q span');
                        if (qText && qText.textContent.trim() === faqTitle) {
                            fi.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            setTimeout(function () {
                                if (!fi.classList.contains('active')) fi.querySelector('.faq-q').click();
                            }, 400);
                        }
                    });
                }
            }

            if (headerSearchForm && headerSearchInput) {
                headerSearchForm.addEventListener('submit', function (e) {
                    e.preventDefault();
                    var val = headerSearchInput.value.trim();
                    if (!val) return;
                    performSearch(val);
                });
                headerSearchInput.addEventListener('input', function () {
                    clearTimeout(suggestDebounce);
                    var val = this.value;
                    suggestDebounce = setTimeout(function () { buildSuggestions(val); }, 150);
                });
                headerSearchInput.addEventListener('keydown', function (e) {
                    if (!suggestionsPanel || !suggestionsPanel.classList.contains('active')) return;
                    var items = suggestionsPanel.querySelectorAll('.suggest-item');
                    if (items.length === 0) return;
                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        activeSuggestIdx = Math.min(activeSuggestIdx + 1, items.length - 1);
                        updateActiveSuggest(items);
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        activeSuggestIdx = Math.max(activeSuggestIdx - 1, -1);
                        updateActiveSuggest(items);
                    } else if (e.key === 'Enter' && activeSuggestIdx >= 0) {
                        e.preventDefault();
                        handleSuggestionClick(items[activeSuggestIdx]);
                    } else if (e.key === 'Escape') { closeSuggestions(); }
                });
                headerSearchInput.addEventListener('blur', function () { setTimeout(closeSuggestions, 200); });
                headerSearchInput.addEventListener('focus', function () {
                    if (this.value.trim()) buildSuggestions(this.value);
                });
                var params = new URLSearchParams(window.location.search);
                if (params.has('q')) headerSearchInput.value = params.get('q');
            }

            function updateActiveSuggest(items) {
                items.forEach(function (el, i) { el.classList.toggle('active', i === activeSuggestIdx); });
                if (activeSuggestIdx >= 0) items[activeSuggestIdx].scrollIntoView({ block: 'nearest' });
            }

            function isValidUrlFormat(str) {
                var s = str.trim();
                if (/^(https?:\/\/)?[\da-z][\da-z\.-]*\.([a-z\.]{2,6})(:\d+)?(\/\S*)?$/i.test(s)) return true;
                if (/^(https?:\/\/)?\d{1,3}\.\d{1,3}(\.\d{1,3}){0,2}(:\d+)?(\/\S*)?$/i.test(s)) return true;
                if (/^(https?:\/\/)?localhost(:\d+)?(\/\S*)?$/i.test(s)) return true;
                return false;
            }

            /* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
               INIT
            â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
            loadData();

        })();
    </script>
